services:
  api:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SCAN_INTERVAL_MIN: ${SCAN_INTERVAL_MIN:-15}
      SCAN_PAIR_LIMIT: ${SCAN_PAIR_LIMIT:-5}
      TOP_PAIRS_COUNT: ${TOP_PAIRS_COUNT:-20}
      DATABASE_URL: sqlite:////app/data/downpour.db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - downpour-data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  downpour-data:
  caddy-data:
  caddy-config:
