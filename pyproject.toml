[project]
name = "downpour-trade-ai"
version = "0.1.0"
description = "Deterministic rules-based crypto trade-decision engine for Binance-listed pairs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
downpour = "cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
