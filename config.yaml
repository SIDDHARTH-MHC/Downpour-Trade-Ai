app_name: Downpour Trade AI

data:
  cache_dir: ./data
  ohlcv_bars: 500
  retry_attempts: 3
  retry_base_delay_sec: 1.0
  staleness_multiplier: 2.0

technical:
  ema_stack_bull: 25
  ema_stack_bear: -25
  ema200_side: 10
  rsi_bull: 10
  rsi_bear: -10
  rsi_overbought_penalty: -10
  rsi_oversold_penalty: 10
  rsi_overbought_threshold: 75
  rsi_oversold_threshold: 25
  rsi_bull_threshold: 60
  rsi_bear_threshold: 40
  macd_bull: 15
  macd_bear: -15
  adx_trend_threshold: 25
  adx_trend_multiplier: 1.25
  adx_chop_threshold: 20
  adx_chop_multiplier: 0.6
  htf_multiplier: 4

flow:
  funding_short_crowd: 15
  funding_long_crowd: -15
  funding_neutral_low: -0.0001
  funding_neutral_high: 0.0001
  funding_crowd_long: 0.0003
  funding_trend: 10
  oi_price_new_longs: 15
  oi_price_new_shorts: -15
  oi_price_short_cover: -5
  oi_price_long_flush: 5
  oi_spike_threshold: 0.08
  oi_spike_multiplier: 1.5
  taker_bull: 10
  taker_bear: -10
  taker_bull_ratio: 0.58
  taker_bear_ratio: 0.42
  raw_scale: 1.5

structure:
  swing_fractal: 5
  cluster_atr_factor: 0.25
  max_levels: 6
  wall_bucket_pct: 0.001
  wall_median_multiplier: 6
  wall_min_notional_btc_eth: 1000000
  wall_min_notional_alt: 250000
  support_near_atr: 0.5
  resistance_near_atr: 0.5
  range_no_edge_atr: 1.5
  support_score: 20
  resistance_score: -20
  breakout_score: 25
  breakdown_score: -25
  bid_ask_ratio_bull: 10
  bid_ask_ratio_bear: -10
  bid_ask_ratio_high: 2.0
  bid_ask_ratio_low: 0.5
  wall_max_contribution: 30
  min_touch_breakout: 3

regime:
  shock_percentile: 90
  compression_percentile: 20
  lookback_days: 90
  btc_move_threshold: 0.02
  weights:
    TRENDING_UP:
      technical: 1.3
      flow: 1.0
      structure: 0.8
    TRENDING_DOWN:
      technical: 1.3
      flow: 1.0
      structure: 0.8
    RANGING:
      technical: 0.7
      flow: 1.0
      structure: 1.4
    COMPRESSION:
      technical: 0.8
      flow: 1.2
      structure: 1.2

synthesizer:
  long_threshold: 35
  short_threshold: -35
  lane_alignment_threshold: 20
  min_aligned_lanes: 2
  max_adverse_lane: -25
  min_adverse_lane_short: 25
  lane_conflict_threshold: 80

risk:
  account_risk_pct: 0.01
  default_equity_usd: 10000
  atr_sl_multiplier: 1.5
  support_sl_buffer_atr: 0.25
  min_reward_risk: 1.2
  tp2_rr_multiplier: 2.0
  trade_timeout_bars: 48

backtest:
  fee_pct: 0.001
  slippage_pct: 0.0005
  default_months: 12

calibration:
  high_win_rate: 0.55
  high_min_trades: 100
  high_profit_factor: 1.4
  moderate_win_rate: 0.48
  moderate_min_trades: 50
  moderate_profit_factor: 1.15
  insufficient_data_trades: 50

pairs:
  default: BTC/USDT
  scan_top: 20
